<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>draggable-scheduler preview</title>
    <style>
* { box-sizing: border-box; }
body { margin: 0; }
/* draggable-scheduler styles
 *
 * This stylesheet mirrors the utility-class look used by the package's React
 * components, so consumers do not need Tailwind just to render the grid.
 */

.mt-2 { margin-top: 0.5rem; }
.mt-3 { margin-top: 0.75rem; }
.mt-1 { margin-top: 0.25rem; }
.mb-1 { margin-bottom: 0.25rem; }
.mb-2 { margin-bottom: 0.5rem; }
.flex { display: flex; }
.grid { display: grid; }
.inline-flex { display: inline-flex; }
.sticky { position: sticky; }
.left-0 { left: 0; }
.z-10 { z-index: 10; }
.min-h-0 { min-height: 0; }
.min-w-0 { min-width: 0; }
.min-h-screen { min-height: 100vh; }
.min-h-\[110px\] { min-height: 110px; }
.min-h-\[116px\] { min-height: 116px; }
.min-w-\[1200px\] { min-width: 1200px; }
.flex-1 { flex: 1 1 0%; }
.shrink-0 { flex-shrink: 0; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.gap-0\.5 { gap: 0.125rem; }
.gap-1 { gap: 0.25rem; }
.gap-1\.5 { gap: 0.375rem; }
.gap-2 { gap: 0.5rem; }
.gap-3 { gap: 0.75rem; }
.gap-4 { gap: 1rem; }
.gap-x-2 { column-gap: 0.5rem; }
.gap-y-1 { row-gap: 0.25rem; }
.space-y-1\.5 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.375rem; }
.space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.75rem; }
.overflow-auto { overflow: auto; }
.cursor-grab { cursor: grab; }
.rounded { border-radius: 0.25rem; }
.rounded-md { border-radius: 0.375rem; }
.rounded-lg { border-radius: 0.5rem; }
.border { border-width: 1px; border-style: solid; }
.border-dashed { border-style: dashed; }
.border-amber-200 { border-color: rgba(253, 230, 138, 1); }
.border-amber-300 { border-color: rgba(252, 211, 77, 1); }
.border-amber-500 { border-color: rgba(245, 158, 11, 1); }
.border-blue-300 { border-color: rgba(147, 197, 253, 1); }
.border-blue-500 { border-color: rgba(59, 130, 246, 1); }
.border-rose-500 { border-color: rgba(244, 63, 94, 1); }
.border-slate-200 { border-color: rgba(226, 232, 240, 1); }
.border-slate-300 { border-color: rgba(203, 213, 225, 1); }
.border-slate-400 { border-color: rgba(148, 163, 184, 1); }
.border-emerald-500 { border-color: rgba(16, 185, 129, 1); }
.bg-amber-50 { background-color: rgba(255, 251, 235, 1); }
.bg-amber-100 { background-color: rgba(254, 243, 199, 1); }
.bg-amber-100\/90 { background-color: rgba(254, 243, 199, 0.9); }
.bg-blue-50 { background-color: rgba(239, 246, 255, 1); }
.bg-blue-100 { background-color: rgba(219, 234, 254, 1); }
.bg-blue-100\/85 { background-color: rgba(219, 234, 254, 0.85); }
.bg-emerald-100\/85 { background-color: rgba(209, 250, 229, 0.85); }
.bg-rose-100\/90 { background-color: rgba(255, 228, 230, 0.9); }
.bg-slate-50 { background-color: rgba(248, 250, 252, 1); }
.bg-slate-50\/50 { background-color: rgba(248, 250, 252, 0.5); }
.bg-slate-100 { background-color: rgba(241, 245, 249, 1); }
.bg-slate-100\/85 { background-color: rgba(241, 245, 249, 0.85); }
.bg-white { background-color: rgba(255, 255, 255, 1); }
.bg-blue-500 { background-color: rgba(59, 130, 246, 1); }
.p-1 { padding: 0.25rem; }
.p-2 { padding: 0.5rem; }
.p-3 { padding: 0.75rem; }
.p-4 { padding: 1rem; }
.px-1\.5 { padding-left: 0.375rem; padding-right: 0.375rem; }
.px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
.py-0\.5 { padding-top: 0.125rem; padding-bottom: 0.125rem; }
.py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
.text-center { text-align: center; }
.text-left { text-align: left; }
.text-xs { font-size: 0.75rem; line-height: 1rem; }
.text-sm { font-size: 0.875rem; line-height: 1.25rem; }
.text-\[10px\] { font-size: 10px; line-height: 1; }
.text-\[11px\] { font-size: 11px; line-height: 1.1; }
.font-semibold { font-weight: 600; }
.leading-tight { line-height: 1.25; }
.text-amber-900 { color: rgba(120, 53, 15, 1); }
.text-blue-800 { color: rgba(30, 64, 175, 1); }
.text-blue-900 { color: rgba(30, 58, 138, 1); }
.text-rose-700 { color: rgba(190, 18, 60, 1); }
.text-slate-400 { color: rgba(148, 163, 184, 1); }
.text-slate-500 { color: rgba(100, 116, 139, 1); }
.text-slate-600 { color: rgba(71, 85, 105, 1); }
.text-slate-700 { color: rgba(51, 65, 85, 1); }
.text-slate-800 { color: rgba(30, 41, 59, 1); }
.text-slate-900 { color: rgba(15, 23, 42, 1); }
.hover\:bg-blue-100:hover { background-color: rgba(219, 234, 254, 1); }
.hover\:bg-slate-50:hover { background-color: rgba(248, 250, 252, 1); }
.hover\:text-slate-600:hover { color: rgba(71, 85, 105, 1); }
.hover\:text-rose-600:hover { color: rgba(225, 29, 72, 1); }
.shadow-sm { box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.08); }
.transition { transition: all 150ms ease; }
.opacity-60 { opacity: 0.6; }

.text-\[10px\].font-semibold,
.text-\[11px\].font-semibold,
.text-xs.font-semibold,
.text-sm.font-semibold {
  letter-spacing: 0.01em;
}

.border-blue-500.bg-blue-100,
.border-blue-500.bg-blue-100\/85 {
  color: rgba(30, 58, 138, 1);
}

.border-rose-500.bg-rose-100\/90 {
  color: rgba(190, 18, 60, 1);
}

.border-amber-500.bg-amber-100\/90 {
  color: rgba(120, 53, 15, 1);
}

.border-emerald-500.bg-emerald-100\/85 {
  color: rgba(6, 95, 70, 1);
}

.rounded.border.border-amber-300.bg-amber-100,
.rounded-md.border.border-slate-400.bg-slate-100,
.rounded-md.border.border-blue-500.bg-blue-100 {
  display: inline-flex;
  align-items: center;
}

.grid.min-w-\[1200px\].gap-x-2.gap-y-1 {
  align-content: start;
}

.min-h-\[110px\].items-center.justify-center {
  flex-direction: column;
}

[role="gridcell"][data-focused="true"] {
  outline: 2px solid rgba(59, 130, 246, 1);
  outline-offset: -2px;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.75);
}

[role="gridcell"][aria-selected="true"] {
  position: relative;
}
